name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt
      - name: Validate rules
        run: python tools/validate.py
      - name: Coverage is up to date
        run: python tools/coverage.py --check
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Export ARM template
        run: python tools/export_arm.py
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-analytics-rules
          path: build/sentinel-analytics-rules.json
